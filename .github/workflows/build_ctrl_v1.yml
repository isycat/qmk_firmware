name: Build isycat VIA firmware (Drop CTRL v1, GMMK Pro)

# QMK 0.27.0 removed the arm_atsam platform, so this branch stays on 0.26.11.
on:
  push:
    branches-ignore: [master, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Init needed submodules
        run: git submodule update --init --depth 1 lib/printf lib/chibios lib/chibios-contrib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi dfu-util
          pip install -r requirements.txt qmk
      - name: Build
        run: |
          export QMK_HOME=$PWD
          make massdrop/ctrl:isycat
          for kb in rev1/ansi rev1/iso rev2/ansi rev2/iso; do make gmmk/pro/$kb:isycat; done
      - uses: actions/upload-artifact@v4
        with:
          name: massdrop_ctrl_isycat-${{ github.sha }}
          path: |
            massdrop_ctrl_isycat.bin
            keyboards/massdrop/ctrl/keymaps/isycat/via/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: gmmk_pro_isycat-${{ github.sha }}
          path: |
            gmmk_pro_*_isycat.bin
            keyboards/gmmk/pro/keymaps/isycat/via/*.json
